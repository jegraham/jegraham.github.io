<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real Estate Vibe Map</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
    <h1>Real Estate Vibe Map</h1>
    
    <!-- Add the checkbox here -->
    <label>
        <input type="checkbox" id="toggleFireStations" checked>
        Fire Stations
    </label>
    <label>
        <input type="checkbox" id="toggleAirports" checked>
        Airports
    </label>
    <label>
        <input type="checkbox" id="togglePoliceStations" checked>
        Police Stations
    </label>
    <label>
        <input type="checkbox" id="toggleRailways" checked>
        Railways
    </label>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js"></script>
    <script src="./map.js"></script>
    <script src="./policestation.js"></script>
    <script src="./firestation.js"></script>
    <script src="./airport.js"></script>
    <script src="./railways.js"></script>
</body>
</html>
