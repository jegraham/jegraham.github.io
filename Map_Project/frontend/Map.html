<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Durham Region Map</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
    <h1>Durham Region Map</h1>
    
    <!-- Add the checkbox here -->
    <label>
        <input type="checkbox" id="toggleFireStations" checked>
        Fire Stations
    </label>
    <label>
        <input type="checkbox" id="toggleAirports" checked>
        Airports
    </label>
    
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js"></script>
    <script src="./map.js"></script>
    <script src="./firestation.js"></script>
    <script src="./airport.js"></script>
</body>
</html>
